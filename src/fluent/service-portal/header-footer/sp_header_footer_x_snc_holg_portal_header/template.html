<!--
  HOLG Portal Header template.

  Structure copied from the live OOTB "Stock Header" record
  (sp_header_footer bf5ec2f2cb10120000f8d856634c9c0c, queried with run_query):
    - single outer <div> root
    - <nav id="responsiveNav" class="navbar-inverse" ng-class="::{'navbar':...}">
    - .navbar-header brand block + navbar-toggle
    - collapsible <div sp-navbar-toggle="" class="collapse navbar-right" id="sp-nav-bar">
      containing <sp-widget widget="::data.menu">, then the logged-in user controls
    - NO navbar-fixed-top class (theme.fixedHeader/body.fixed-header handles sticky)

  Deliberate differences from the OOTB record, per the requested change:
    - The brand block renders the inlined ServiceNow wordmark SVG + app title +
      "Built with App Engine" label instead of the portal.logo <img> / text fallback.
      Because the SVG is always present there is no blank-logo failure mode, so the
      OOTB ng-if="::!portal.logo" text-only branch is not needed.
    - The anonymous "Login" link + openLogin() modal and the Live Chat link are
      omitted (not requested; portal pages are role-gated and redirect to the
      login page). The logged-in Profile/Logout controls are preserved so the
      portal does not lose its only logout affordance.
    - The app title is bound to ::portal.title (the OOTB Stock Header
      portal-title binding) - nothing is hardcoded.
-->
<div>
  <nav id="responsiveNav" class="navbar-inverse snc-brand-nav" ng-class="::{'navbar':!isViewNative, 'is-native': isViewNative}"
       role="navigation" aria-label="${Primary}">
    <div ng-show="::!isViewNative" class="navbar-header snc-brand-container">

        <a class="navbar-brand snc-brand-link" ng-href="?id={{::portal.homepage_dv}}" ng-click="collapse()" aria-label="{{::logoText}}">

            <polygon points="116.788 19.35 114.237 19.35 109.15 6.523 112.57 6.523 115.359 13.853 118.094 6.523 120.952 6.523 123.662 13.853 126.475 6.523 129.896 6.523 124.809 19.35 122.258 19.35 119.523 12.046 116.788 19.35" fill="#293e40" fill-rule="evenodd"/>

          </svg>
        </a>
        <span class="snc-brand-title" ng-bind="::portal.title"></span>
        <span class="snc-brand-tagline hidden-xs">${Built with App Engine}</span>
      </div>
      <button ng-if="data.hasMenuItems || user.logged_in" type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-placement="bottom" data-toggle-second="tooltip" data-original-title="{{::data.toggleMsg}}" data-target="#sp-nav-bar" aria-haspopup="menu">
        <span class="sr-only">${Toggle navigation}</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
    </div>

    <div sp-navbar-toggle="" class="collapse navbar-right" id="sp-nav-bar" role="navigation">
      <!-- Include The Menu (this portal has no mainMenu today, so this renders nothing) -->
      <sp-widget widget="::data.menu"></sp-widget>
      <ul ng-if="user.logged_in" class="nav navbar-nav">
        <li ng-if="showAvatar" class="hidden-xs hidden-sm dropdown">
          <a href class="toggle-dropdown" data-toggle="dropdown" aria-expanded="false" aria-label="{{::data.profileBtnMsg}}: {{::user.name}}" id="profile-dropdown" role="button" aria-haspopup="true">
            <span class="navbar-avatar" aria-hidden="true"><sn-avatar class="avatar-small-medium" primary="avatarProfile" /></span>
            <span class="visible-lg-inline">{{::user.name}}</span>
          </a>
          <ul class="dropdown-menu" aria-label="{{::data.profileBtnMsg}}">
            <li><a tabindex="-1" ng-href="?id=user_profile&sys_id={{::user.sys_id}}">${Profile}</a></li>
            <li><a tabindex="-1" href="{{::portal.logoutUrl}}">${Logout}</a></li>
          </ul>
        </li>
        <li ng-if="showSMAvatar" class="visible-xs-block visible-sm-block"><a ng-href="?id=user_profile&sys_id={{::user.sys_id}}" ng-click="collapse()">
          <span class="navbar-avatar"><sn-avatar class="avatar-small-medium" primary="avatarProfile" /></span>{{::user.name}}</a>
        </li>
        <li class="visible-xs-block visible-sm-block"><a ng-href="{{::portal.logoutUrl}}" ng-click="collapse()">${Logout}</a></li>
      </ul>
    </div>
  </nav>
</div>
